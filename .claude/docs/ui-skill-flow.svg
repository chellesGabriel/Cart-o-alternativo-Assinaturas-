<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1380" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .step-num { font-size: 13px; font-weight: 700; fill: #fff; }
      .box-title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .box-text { font-size: 12px; fill: #334155; }
      .box-mono { font-size: 11px; font-family: ui-monospace, Menlo, monospace; fill: #1e293b; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; }
      .legend { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <text x="40" y="44" class="title">Fluxo da skill /ui — Eduzz Design Rules</text>
  <text x="40" y="68" class="subtitle">Ordem de leitura dos arquivos, fontes consultadas e auditoria final</text>

  <!-- 0. Trigger -->
  <rect x="380" y="100" width="340" height="64" rx="12" fill="#1e293b"/>
  <text x="550" y="128" text-anchor="middle" class="box-title" style="fill:#fff">Usuário invoca /ui</text>
  <text x="550" y="148" text-anchor="middle" class="box-text" style="fill:#cbd5e1">criar ou modificar uma tela / componente</text>

  <!-- 1. Ant Design -->
  <rect x="60" y="220" width="460" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="96" cy="258" r="16" fill="#3b82f6"/>
  <text x="96" y="263" text-anchor="middle" class="step-num">1</text>
  <text x="124" y="264" class="box-title">Ler llms.txt do Ant Design</text>
  <text x="84" y="304" class="box-mono">WebFetch → https://ant.design/llms.txt</text>
  <text x="84" y="332" class="box-text">A partir do índice, segue para cada componente envolvido:</text>
  <text x="84" y="356" class="box-mono">https://ant.design/components/{nome}/index.md</text>
  <text x="84" y="384" class="box-text">→ obtém props, exemplos e APIs atualizadas</text>
  <text x="84" y="408" class="box-text">Visão completa opcional: llms-full.txt</text>

  <!-- 2. Rootzz -->
  <rect x="580" y="220" width="460" height="220" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <circle cx="616" cy="258" r="16" fill="#f97316"/>
  <text x="616" y="263" text-anchor="middle" class="step-num">2</text>
  <text x="644" y="264" class="box-title">Ler llms.txt do Rootzz (DS Eduzz)</text>
  <text x="604" y="304" class="box-mono">WebFetch → https://ds.rootzz.xyz/llms.txt</text>
  <text x="604" y="332" class="box-text">A partir do índice, lê os arquivos relevantes:</text>
  <text x="604" y="354" class="box-text">• regras gerais</text>
  <text x="604" y="374" class="box-text">• foundations (theme, tokens, typography)</text>
  <text x="604" y="394" class="box-text">• components / patterns específicos da tarefa</text>
  <text x="604" y="420" class="box-text" font-weight="600" style="fill:#9a3412">⚠ extensão .txt (não .md)</text>

  <!-- 3. Implementar -->
  <rect x="280" y="470" width="540" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="312" cy="500" r="16" fill="#22c55e"/>
  <text x="312" y="505" text-anchor="middle" class="step-num">3</text>
  <text x="340" y="506" class="box-title">Consolidar contexto e implementar a tela</text>
  <text x="296" y="538" class="box-text">Só depois de ler as duas fontes, produz o código:</text>
  <text x="296" y="558" class="box-text">aplica regras do Design System Eduzz</text>
  <text x="296" y="576" class="box-text">por cima da API do antd → Edit / Write nos arquivos do projeto</text>

  <!-- 4. Auditoria -->
  <rect x="280" y="650" width="540" height="170" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="312" cy="680" r="16" fill="#a855f7"/>
  <text x="312" y="685" text-anchor="middle" class="step-num">4</text>
  <text x="340" y="686" class="box-title">Auditoria pós-implementação</text>
  <text x="296" y="718" class="box-text">Invoca o subagent via Agent tool, passando a lista exata</text>
  <text x="296" y="736" class="box-text">dos arquivos criados/modificados nesta resposta:</text>
  <rect x="296" y="750" width="508" height="58" rx="6" fill="#1e1b4b"/>
  <text x="308" y="770" class="box-mono" style="fill:#e9d5ff">Agent({</text>
  <text x="308" y="786" class="box-mono" style="fill:#e9d5ff">  subagent_type: "audit-ds",</text>
  <text x="308" y="802" class="box-mono" style="fill:#e9d5ff">  prompt: "Audite e corrija: src/pages/Login.tsx, ..."  })</text>

  <!-- 5. Decisão -->
  <polygon points="550,870 760,930 550,990 340,930" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="550" y="924" text-anchor="middle" class="box-title">Violações do DS?</text>
  <text x="550" y="946" text-anchor="middle" class="box-text">checklist do auditor</text>

  <!-- 6a. Corrige -->
  <rect x="60" y="1040" width="420" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="80" y="1070" class="box-title">Sim → corrige nos próprios arquivos</text>
  <text x="80" y="1098" class="box-text">O agente edita diretamente os arquivos auditados,</text>
  <text x="80" y="1116" class="box-text">aplicando as correções para conformidade com o DS.</text>

  <!-- 6b. Confirma -->
  <rect x="620" y="1040" width="420" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="1070" class="box-title">Não → apenas confirma</text>
  <text x="640" y="1098" class="box-text">Sem inconsistências detectadas;</text>
  <text x="640" y="1116" class="box-text">o agente devolve confirmação curta.</text>

  <!-- 7. Resposta final -->
  <rect x="280" y="1200" width="540" height="100" rx="12" fill="#0f172a"/>
  <text x="550" y="1232" text-anchor="middle" class="box-title" style="fill:#fff">Resposta final ao usuário</text>
  <text x="550" y="1258" text-anchor="middle" class="box-text" style="fill:#cbd5e1">Inclui, na íntegra, o relatório retornado</text>
  <text x="550" y="1276" text-anchor="middle" class="box-text" style="fill:#cbd5e1">pelo subagent audit-ds</text>

  <!-- Edges -->
  <path class="edge" d="M 480 164 Q 400 200 290 215" marker-end="url(#arrow)"/>
  <path class="edge" d="M 620 164 Q 700 200 810 215" marker-end="url(#arrow)"/>
  <path class="edge" d="M 290 440 Q 290 458 390 467" marker-end="url(#arrow)"/>
  <path class="edge" d="M 810 440 Q 810 458 710 467" marker-end="url(#arrow)"/>
  <path class="edge" d="M 550 600 L 550 647" marker-end="url(#arrow)"/>
  <path class="edge" d="M 550 820 L 550 867" marker-end="url(#arrow)"/>
  <path class="edge" d="M 340 930 Q 200 985 270 1037" marker-end="url(#arrow)"/>
  <path class="edge" d="M 760 930 Q 900 985 830 1037" marker-end="url(#arrow)"/>
  <path class="edge" d="M 270 1150 Q 360 1180 440 1197" marker-end="url(#arrow)"/>
  <path class="edge" d="M 830 1150 Q 740 1180 660 1197" marker-end="url(#arrow)"/>

  <!-- Legenda -->
  <g transform="translate(225, 1340)">
    <rect width="14" height="14" fill="#3b82f6"/><text x="22" y="12" class="legend">1. Ant Design</text>
    <rect x="130" width="14" height="14" fill="#f97316"/><text x="152" y="12" class="legend">2. Rootzz (DS Eduzz)</text>
    <rect x="320" width="14" height="14" fill="#22c55e"/><text x="342" y="12" class="legend">3. Implementação</text>
    <rect x="500" width="14" height="14" fill="#a855f7"/><text x="522" y="12" class="legend">4. Auditoria audit-ds</text>
  </g>
</svg>
